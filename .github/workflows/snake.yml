name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      # Colours match generator/config.mjs: cream -> light red -> red -> ink, with a blue snake (yellow on dark).
      - name: Generate snake SVG
        uses: platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.LINHTINH_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#3F82E0&color_dots=#E8DFC8,#F7C0B6,#F2857A,#EE4B3A,#141414
            dist/github-snake-dark.svg?color_snake=#F4C92E&color_dots=#1E222A,#571A14,#A63528,#EE4B3A,#F4ECD8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
