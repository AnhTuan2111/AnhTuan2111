name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      # One red ramp, matching generator/config.mjs: busier days are a deeper red on light pages and a
      # brighter red on dark ones. Blue snake on light, yellow on dark.
      - name: Generate snake SVG
        uses: platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.LINHTINH_TOKEN }}
          outputs: |
            dist/github-snake.svg?color_snake=#3F82E0&color_dots=#E8DFC8,#F7C6BC,#F1907F,#E9523F,#A9241A
            dist/github-snake-dark.svg?color_snake=#F4C92E&color_dots=#1E222A,#5A1A13,#9C2F23,#DC4433,#FF7461

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
